[project]
name = "summit-hvac-receptionist"
version = "0.1.0"
description = "After-hours AI phone receptionist (Retell + FastAPI) - white-label ready"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = []

# Vercel zero-config FastAPI: serve app.main:app with the ORIGINAL request path.
# Do NOT add vercel.json "rewrites"/"routes" to an api/ file: the function then sees the
# rewritten path (e.g. /api/index) and FastAPI 404s every route.
[tool.vercel]
entrypoint = "app.main:app"
