scheduling:
  # Technician availability. Day keys: mon..sun. Omit a day = no appointments.
  business_hours:
    mon: ["08:00", "18:00"]
    tue: ["08:00", "18:00"]
    wed: ["08:00", "18:00"]
    thu: ["08:00", "18:00"]
    fri: ["08:00", "18:00"]
    sat: ["09:00", "15:00"]
  window_hours: 2          # length of each arrival window
  window_step_hours: 2     # spacing between window starts
  min_lead_hours: 2        # earliest bookable = now + this
  max_days_ahead: 7
  slots_to_offer: 3
  max_slots_per_day: 2     # spread offers over more than one day when possible

pricing:
  dispatch_fee_usd: 89
  dispatch_fee_note: "This covers the technician's trip and diagnosis, and it's applied toward the repair if you go ahead with it."
  quote_policy: "We don't quote new-system prices over the phone. A technician visits your home, assesses it, and gives you a written quote."

